name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ws_url:
        description: 'WebSocket URL сервера (например: wss://xxx.ngrok-free.app)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - run: npm run build
        working-directory: client
        env:
          VITE_WS_URL: ${{ inputs.ws_url }}
          VITE_BASE: /quiz/

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./client/dist
